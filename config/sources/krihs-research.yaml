id: krihs-research
name: 국토연구원
adapter: static_board
implementation: report_collector.adapters.sources.krihs.adapter:KrihsAdapter
homepage_url: https://www.krihs.re.kr
list_url: https://www.krihs.re.kr/krihsLibraryReport/reportList.es?mid=a10102000000
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 20
max_retries: 2
active: true
selectors:
  list_item: li
  title: strong.title
  detail_link: a[href*="viewCntAdd"]
filters:
  allowed_extensions: [pdf]
  include_title_keywords: []
  exclude_title_keywords: [채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
