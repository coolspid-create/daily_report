id: ibks-research
name: IBK투자증권 리서치
adapter: rendered_board
implementation: report_collector.adapters.sources.ibks.adapter:IbksResearchAdapter
homepage_url: https://www.ibks.com
list_url: https://m.ibks.com/iko/IKO010101.do
rights_default: LINK_ONLY
content_type: REPORT
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 600
max_retries: 2
active: true
selectors:
  list_item: li:has(a.down):has(p.tit)
  title: p.tit
  detail_link: a.down
  published_at: .date
browser:
  wait_for: li a.down
  timeout_ms: 60000
filters:
  allowed_extensions: [pdf]
  max_age_days: 30
  max_items_per_run: 5
