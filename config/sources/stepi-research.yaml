id: stepi-research
name: 과학기술정책연구원
adapter: rendered_board
implementation: report_collector.adapters.sources.stepi.adapter:StepiAdapter
homepage_url: https://www.stepi.re.kr
list_url: https://www.stepi.re.kr/site/stepiko/ex/bbs/reportCateList.do?cateTypeCd=STEPI_REPORT
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 20
max_retries: 2
active: false
selectors:
  list_item: li
  title: a[href*="reportView"]
  detail_link: a[href*="reportView"]
browser:
  wait_for: body
  timeout_ms: 30000
filters:
  allowed_extensions: [pdf]
  include_title_keywords: []
  exclude_title_keywords: [채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
