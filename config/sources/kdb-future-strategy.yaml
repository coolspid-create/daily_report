list_url: https://rd.kdb.co.kr/FLSRIA02N01.act
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: '#tableList tbody tr'
  title: td.al a.links
  detail_link: td.al a.links
