id: kinu-research
name: 통일연구원
adapter: static_board
homepage_url: https://www.kinu.or.kr
list_url: https://www.kinu.or.kr/main/module/report/index.do?nav_code=mai1674786094
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
max_retries: 2
active: true
selectors:
  list_item: li.bx
  title: a.subject
  detail_link: a.subject[href*="view.do"]
  published_at: .desc dl dd:first-of-type
detail:
  summary: .cont_abstract
filters:
  allowed_extensions: [pdf]
  include_title_keywords: []
  exclude_title_keywords: [채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
