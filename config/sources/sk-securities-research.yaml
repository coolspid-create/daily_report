id: sk-securities-research
name: SK증권 리서치
adapter: static_board
implementation: report_collector.adapters.sources.telegram_research.adapter:OfficialTelegramResearchAdapter
homepage_url: https://www.sks.co.kr
list_url: https://t.me/s/sksresearch
rights_default: LINK_ONLY
content_type: REPORT
poll_interval_minutes: 720
request_delay_ms: 1200
timeout_seconds: 30
run_timeout_seconds: 600
max_retries: 2
active: true
selectors:
  list_item: .tgme_widget_message
  title: .tgme_widget_message_text
  detail_link: .tgme_widget_message_text a
  published_at: time
filters:
  allowed_extensions: [pdf]
  max_age_days: 30
  max_items_per_run: 5
