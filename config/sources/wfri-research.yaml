id: wfri-research
name: 우리금융경영연구소 연구보고서
adapter: static_board
implementation: report_collector.adapters.sources.public_research.adapter:PublicResearchAdapter
homepage_url: https://www.wfri.re.kr/ko/web/main.php
list_url: https://www.wfri.re.kr/ko/web/research_report/research_report.php
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: li:has(a[href*='page_type=view'])
  title: .report-item__title
  detail_link: a[href*='page_type=view']
filters:
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
