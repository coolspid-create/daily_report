id: ibk-economy-research
name: IBK경제연구소
adapter: static_board
homepage_url: https://research.ibk.co.kr/research/board/economy/list
list_url: https://research.ibk.co.kr/research/board/economy/list
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: li.article
  title: h3.subject a
  detail_link: h3.subject a
  published_at: .meta
detail:
  attachments: a.down-document
  summary: .contents
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
