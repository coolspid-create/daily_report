id: kiep-research
name: 대외경제정책연구원
adapter: static_board
homepage_url: https://www.kiep.go.kr
list_url: https://www.kiep.go.kr/gallery.es?bid=0001&mid=a10101020000&nPage=1&tag=
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 20
max_retries: 2
active: true
selectors:
  list_item: ul.board_book.research_report > li
  title: div.desc > a > strong.title
  detail_link: div.desc > a
  published_at: p.info span:last-child
detail:
  published_at: span:has(> strong)
  summary: div.item.item1.active div.txt
filters:
  allowed_extensions: [pdf]
  include_title_keywords: []
  exclude_title_keywords: [채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
