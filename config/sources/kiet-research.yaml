id: kiet-research
name: 산업연구원
adapter: rendered_board
homepage_url: https://www.kiet.re.kr
list_url: https://www.kiet.re.kr/research/reportList
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
max_retries: 2
active: true
selectors:
  list_item: li.item
  title: .rpt_tit a strong
  detail_link: .rpt_tit a[href*="reportView"]
  published_at: span.date
detail:
  summary: .p_d-cont .tab_box.open .ind_txt
filters:
  allowed_extensions: [pdf]
  include_title_keywords: []
  exclude_title_keywords: [채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
browser:
  wait_for: li.item .rpt_tit a[href*="reportView"]
  timeout_ms: 30000
