id: korea-ratings-research
name: 한국기업평가
adapter: static_board
homepage_url: https://www.korearatings.com
list_url: https://www.korearatings.com/ratingsInfo/researchList.do
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
# 공개 파일 경로가 보호된 스크립트 인자에 의존하므로 접근 제한을 우회하지 않고 비활성화합니다.
active: false
selectors:
  list_item: tbody tr
  title: a
  detail_link: a
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
