id: posri-research
name: 포스코경영연구원 연구보고서
adapter: static_board
implementation: report_collector.adapters.sources.public_research.adapter:PublicResearchAdapter
homepage_url: https://www.posri.re.kr/kor/index.do
list_url: https://www.posri.re.kr/kor/bbs/report_list.do?mmcd=2402221432440016120&cate=2403071010350015910
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: p.h_1:has(a[href*='bbs_view.do'])
  title: a[href*='bbs_view.do']
  detail_link: a[href*='bbs_view.do']
filters:
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
