id: ifans-focus
name: 외교안보연구소 IFANS FOCUS
adapter: static_board
implementation: report_collector.adapters.sources.public_research.adapter:PublicResearchAdapter
homepage_url: https://www.ifans.go.kr/knda/ifans/kor/main/IfansMain.do
list_url: https://www.ifans.go.kr/knda/ifans/kor/pblct/PblctList.do?menuCl=P07
detail_url_template: https://www.ifans.go.kr/knda/ifans/kor/pblct/PblctView.do?menuCl=P07&pblctDtaSn={key}&clCode=P07
source_item_key_pattern: "fnCmdView\\('([0-9]+)'"
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: li:has(a[onclick*='fnCmdView'])
  title: a[onclick*='fnCmdView']
  detail_link: a[onclick*='fnCmdView']
detail:
  attachments: a[href*='fileDown'], a[href$='.pdf']
  summary: .view-content, .board-view, article
filters:
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
