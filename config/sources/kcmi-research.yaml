id: kcmi-research
name: 자본시장연구원
adapter: static_board
implementation: report_collector.adapters.sources.kcmi.adapter:KcmiReportAdapter
homepage_url: https://www.kcmi.re.kr/report/report_list
list_url: https://www.kcmi.re.kr/report/report_list
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: .list
  title: .rpt_title strong
  detail_link: a[onclick*="viewpage"]
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
