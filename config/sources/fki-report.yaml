id: fki-report
name: 한국경제인협회 연구자료
adapter: static_board
implementation: report_collector.adapters.sources.public_research.adapter:PublicResearchAdapter
homepage_url: https://www.fki.or.kr/kor/main/main.do
list_url: https://www.fki.or.kr/kor/publication/report.do
detail_url_template: https://www.fki.or.kr/kor/publication/report_detail.do?bbs_id={key}&category=RE&pageIndex=1
source_item_key_pattern: "detailNT\\('([0-9]+)'\\)"
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: li:has(a.subject)
  title: a.subject
  detail_link: a.subject
detail:
  attachments: a.download[href*='fileDown']
  summary: .view-content, .board-view, article
filters:
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
