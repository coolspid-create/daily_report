id: mohw-press
name: 보건복지부 보도자료
adapter: static_board
implementation: report_collector.adapters.sources.ministry_press.adapter:MinistryPressAdapter
homepage_url: https://www.mohw.go.kr
list_url: https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027
rights_default: LINK_ONLY
content_type: PRESS_RELEASE
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: tbody tr
  title: td.tit a
  detail_link: td.tit a
filters:
  allowed_extensions: [pdf, hwpx, hwp]
  exclude_title_keywords: [채용, 입찰, 행사, 공고, 동정, 포토, 인사]
  max_age_days: 1
  max_items_per_run: 20
