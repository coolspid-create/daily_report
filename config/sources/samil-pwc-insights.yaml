id: samil-pwc-insights
name: 삼일PwC 인사이트
adapter: rendered_board
implementation: report_collector.adapters.sources.pwc.adapter:SamilPwcAdapter
homepage_url: https://www.pwc.com/kr/ko/insights.html
list_url: https://www.pwc.com/kr/ko/insights/issue-brief.html
collection_urls:
  - https://www.pwc.com/kr/ko/insights/issue-brief.html
  - https://www.pwc.com/kr/ko/insights/samil-insight.html
  - https://www.pwc.com/kr/ko/insights/industry-focus.html
  - https://www.pwc.com/kr/ko/insights/global-trends.html
  - https://www.pwc.com/kr/ko/press-room.html
rights_default: LINK_ONLY
content_type: REPORT
poll_interval_minutes: 720
request_delay_ms: 1200
timeout_seconds: 30
run_timeout_seconds: 600
max_retries: 2
active: true
selectors:
  list_item: a[href]
  title: a
  detail_link: a
browser:
  timeout_ms: 60000
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [채용, 입찰, 행사, 공고, 뉴스레터]
  max_age_days: 30
  max_items_per_run: 30
