id: kisdi-stat
name: 정보통신정책연구원 KISDI STAT
adapter: static_board
implementation: report_collector.adapters.sources.kisdi.adapter:KisdiAdapter
homepage_url: https://www.kisdi.re.kr
list_url: https://www.kisdi.re.kr/report/list.do?key=m2101113025790&arrMasterId=4333447
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
selectors:
  list_item: '#dataList > li.renew'
  title: "a[onclick*='goView'] > strong"
  detail_link: "a[onclick*='goView']"
  published_at: .date
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [채용, 입찰, 행사, 공고, 보도자료]
  max_age_days: 7
  max_items_per_run: 20
