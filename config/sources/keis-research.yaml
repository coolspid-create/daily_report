id: keis-research
name: 한국고용정보원
adapter: static_board
implementation: report_collector.adapters.sources.keis.adapter:KeisResearchAdapter
homepage_url: https://www.keis.or.kr
list_url: https://www.keis.or.kr/keis/ko/proj/113/pblc/list.do
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: tr.flex-md-order
  title: .cell-subject a[onclick*="goDetail"]
  detail_link: .cell-subject a[onclick*="goDetail"]
  published_at: .cell-date
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
