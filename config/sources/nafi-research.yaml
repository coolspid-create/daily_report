id: nafi-research
name: 국회미래연구원
adapter: static_board
implementation: report_collector.adapters.sources.nafi.adapter:NafiResearchAdapter
homepage_url: https://nafi.re.kr/home/kor/board.do?menuPos=13
list_url: https://nafi.re.kr/home/kor/board.do?menuPos=13
rights_default: LINK_ONLY
poll_interval_minutes: 720
request_delay_ms: 1500
timeout_seconds: 30
run_timeout_seconds: 180
max_retries: 2
active: true
selectors:
  list_item: tbody tr
  title: a[onclick*="fn_edit"]
  detail_link: a[onclick*="fn_edit"]
filters:
  allowed_extensions: [pdf]
  exclude_title_keywords: [보도자료, 채용, 입찰, 행사, 공고]
  max_age_days: 7
  max_items_per_run: 20
