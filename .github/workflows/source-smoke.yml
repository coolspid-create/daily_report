name: Source smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17 21 * * 1"

jobs:
  live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e "./services/collector[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: pytest -m live services/collector/tests/live
