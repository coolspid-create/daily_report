name: Collector
run-name: Collector / ${{ github.event.schedule == '30 1 * * 1-5' && 'press' || inputs.reprocess_sources && 'reprocess' || inputs.fallback && (inputs.run_mode == 'press' && 'press-fallback' || 'report-fallback') || inputs.run_mode || 'scheduled' }}

on:
  schedule:
    - cron: '35 23 * * 0-4'
    - cron: '30 1 * * 1-5'
  workflow_dispatch:
    inputs:
      automatic:
        description: 정기 예약 또는 백업 실행의 중복 방지 적용
        type: boolean
        default: false
      no_telegram:
        description: Telegram 발송 없이 공개 자료만 복구
        type: boolean
        default: false
      fallback:
        description: 백업 실행 표시 (자료 종류별 하루 1회 제한)
        type: boolean
        default: false
      scheduled_run:
        description: 당일 정기 발행 슬롯으로 처리
        required: false
        type: boolean
        default: false
      run_mode:
        description: 리포트 정기 수집, 보도자료 수집 또는 관리자 승인 후 재발행
        required: false
        type: choice
        options: [scheduled, press, refresh]
        default: scheduled
      reprocess_sources:
        description: AI 분석을 다시 수행할 출처 slug 목록(쉼표 구분). Telegram은 발송하지 않습니다.
        required: false
        type: string
        default: ""

concurrency:
  group: daily-public-report
  queue: max

permissions:
  actions: read
  contents: read

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check today's automatic collection
        id: automatic
        if: github.event_name == 'schedule' || inputs.automatic
        uses: actions/github-script@v7
        env:
          COLLECTION_MODE: ${{ (github.event.schedule == '30 1 * * 1-5' || inputs.run_mode == 'press') && 'press' || 'scheduled' }}
          COLLECTOR_FALLBACK: ${{ inputs.fallback }}
        with:
          script: |
            await require('./scripts/press-watchdog.cjs').checkCollector({
              github, context, core, mode: process.env.COLLECTION_MODE,
              isFallback: process.env.COLLECTOR_FALLBACK === 'true',
            });
      - uses: actions/setup-python@v5
        if: steps.automatic.outputs.collect != 'false'
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./services/collector
        if: steps.automatic.outputs.collect != 'false'
      - run: python -m playwright install --with-deps chromium
        if: steps.automatic.outputs.collect != 'false'
      - run: |
          if [ -n "$REPROCESS_SOURCES" ]; then
            IFS=',' read -ra SOURCES <<< "$REPROCESS_SOURCES"
            for source in "${SOURCES[@]}"; do
              if ! python -m report_collector collect --source "$source" --refresh-recent; then
                echo "::warning::collection failed for $source; continuing with the remaining targeted sources"
                continue
              fi
              python -m report_collector auto-review --timezone Asia/Seoul --window-hours 168 --source "$source" --apply
            done
            python -m report_collector publish-approved --timezone Asia/Seoul --no-telegram
          elif [ "${{ inputs.run_mode }}" = "refresh" ]; then
            python -m report_collector publish-approved --timezone Asia/Seoul
          elif [ "${{ inputs.run_mode }}" = "press" ] || [ "$COLLECTOR_CRON" = "30 1 * * 1-5" ]; then
            python -m report_collector collect-press --timezone Asia/Seoul --window-hours 168
          elif [ "${{ inputs.scheduled_run }}" = "true" ] || [ "$COLLECTOR_CRON" = "35 23 * * 0-4" ]; then
            python -m report_collector daily-publish --timezone Asia/Seoul --window-hours 168 --scheduled-run
          else
            python -m report_collector daily-publish --timezone Asia/Seoul --window-hours 168
          fi
        if: steps.automatic.outputs.collect != 'false'
        env:
          REPROCESS_SOURCES: ${{ inputs.reprocess_sources }}
          COLLECTOR_CRON: ${{ github.event.schedule }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_POLICY_VERSION: "2026-08-pilot-v2"
          PRESS_RETRY_DELAY_SECONDS: ${{ vars.PRESS_RETRY_DELAY_SECONDS || '60' }}
          PRESS_FALLBACK_RUN: ${{ inputs.fallback || 'false' }}
          ANALYSIS_PROVIDER: ${{ vars.ANALYSIS_PROVIDER || 'extractive' }}
          ANALYSIS_API_KEY: ${{ secrets.ANALYSIS_API_KEY }}
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL || 'gpt-5-mini' }}
          TELEGRAM_ENABLED: ${{ !inputs.no_telegram && (vars.TELEGRAM_ENABLED || 'false') || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DESTINATION_KEY: "daily-report-main"
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
      - name: Revalidate published public feed
        if: ${{ !cancelled() && steps.automatic.outputs.collect != 'false' }}
        run: |
          if [ -z "$PUBLIC_WEB_URL" ] || [ -z "$FEED_REVALIDATION_SECRET" ]; then
            echo "::warning::public feed revalidation skipped: PUBLIC_WEB_URL or FEED_REVALIDATION_SECRET is missing"
            exit 0
          fi
          curl --fail --retry 2 --retry-delay 2 --request POST \
            "${PUBLIC_WEB_URL%/}/api/cron/revalidate-public-feed" \
            --header "Authorization: Bearer $FEED_REVALIDATION_SECRET"
        env:
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          FEED_REVALIDATION_SECRET: ${{ secrets.FEED_REVALIDATION_SECRET }}
