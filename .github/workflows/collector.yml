name: Collector

on:
  workflow_dispatch:
    inputs:
      scheduled_run:
        description: Vercel Cron에서 호출한 정기 실행인지 여부
        required: false
        type: boolean
        default: false
      run_mode:
        description: 정기 수집 또는 관리자 승인 후 재발행
        required: false
        type: choice
        options: [scheduled, refresh]
        default: scheduled
      reprocess_sources:
        description: AI 분석을 다시 수행할 출처 slug 목록(쉼표 구분). Telegram은 발송하지 않습니다.
        required: false
        type: string
        default: ""

concurrency:
  group: daily-public-report
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ./services/collector
      - run: python -m playwright install --with-deps chromium
      - run: |
          if [ -n "${{ inputs.reprocess_sources }}" ]; then
            IFS=',' read -ra SOURCES <<< "${{ inputs.reprocess_sources }}"
            for source in "${SOURCES[@]}"; do
              python -m report_collector collect --source "$source" --refresh-recent
            done
            python -m report_collector publish-approved --timezone Asia/Seoul --no-telegram
          elif [ "${{ inputs.run_mode }}" = "refresh" ]; then
            python -m report_collector publish-approved --timezone Asia/Seoul
          elif [ "${{ inputs.scheduled_run }}" = "true" ]; then
            python -m report_collector daily-publish --timezone Asia/Seoul --window-hours 168 --scheduled-run
          else
            python -m report_collector daily-publish --timezone Asia/Seoul --window-hours 168
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AUTO_APPROVAL_ENABLED: ${{ vars.AUTO_APPROVAL_ENABLED || 'false' }}
          AUTO_APPROVAL_POLICY_VERSION: "2026-08-v1"
          ANALYSIS_PROVIDER: ${{ vars.ANALYSIS_PROVIDER || 'extractive' }}
          ANALYSIS_API_KEY: ${{ secrets.ANALYSIS_API_KEY }}
          ANALYSIS_MODEL: ${{ vars.ANALYSIS_MODEL || 'gpt-5-mini' }}
          TELEGRAM_ENABLED: ${{ vars.TELEGRAM_ENABLED || 'false' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_DESTINATION_KEY: "daily-report-main"
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
      - name: Revalidate published public feed
        if: ${{ success() }}
        run: |
          if [ -z "$PUBLIC_WEB_URL" ] || [ -z "$PUBLIC_FEED_REVALIDATION_SECRET" ]; then
            echo "public feed revalidation skipped: required configuration is missing"
            exit 0
          fi
          curl --fail --retry 2 --retry-delay 2 --request POST \
            "${PUBLIC_WEB_URL%/}/api/cron/revalidate-public-feed" \
            --header "Authorization: Bearer $PUBLIC_FEED_REVALIDATION_SECRET"
        env:
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          PUBLIC_FEED_REVALIDATION_SECRET: ${{ secrets.PUBLIC_FEED_REVALIDATION_SECRET }}
