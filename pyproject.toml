[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["report_collector"]
mypy_path = ["services/collector/src"]

[[tool.mypy.overrides]]
module = "fitz.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/collector/tests"]
addopts = "-q --strict-markers -m 'not live'"
markers = ["live: network-dependent smoke tests excluded from default CI"]
