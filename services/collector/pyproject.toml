[build-system]
requires = ["hatchling>=1.28"]
build-backend = "hatchling.build"

[project]
name = "report-collector"
version = "0.1.0"
description = "HTML, RSS and browser-rendered public report collector"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "jsonschema[format]>=4.26,<5",
  "lxml>=6,<7",
  "playwright>=1.58,<2",
  "psycopg[binary]>=3.3,<4",
  "pydantic>=2.13,<3",
  "pymupdf>=1.27,<2",
  "pyyaml>=6.0,<7"
]

[project.optional-dependencies]
dev = ["mypy>=1.19,<2", "pytest>=9.0,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1", "types-jsonschema>=4.26", "types-pyyaml>=6.0"]

[project.scripts]
report-collector = "report_collector.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/report_collector"]

[tool.hatch.build.targets.wheel.force-include]
"src/report_collector/digest/templates" = "report_collector/digest/templates"
